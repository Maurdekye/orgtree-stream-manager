[package]
name = "sm-connectors"
description = "Stream manager connectors: Twitch EventSub + Helix requests, obs-websocket v5"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sm-core = { path = "../sm-core" }
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time"] }
# wss:// uses rustls with the OS root store (coordinator 2026-11-02: prefer native roots).
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
base64 = "0.23"
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util"] }
