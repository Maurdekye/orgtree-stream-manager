[workspace]
resolver = "2"
members = ["crates/sm-core", "crates/sm-store", "crates/sm-server", "crates/sm-connectors", "crates/sm-bridge", "crates/sm-bin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
strsim = "0.11"
unicode-normalization = "0.1"
unicode-segmentation = "1"
thiserror = "2"
